<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="aetherPrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="aetherSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glowBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Monogram -->
  <circle cx="256" cy="240" r="140" fill="#0284c7" opacity="0.18" filter="url(#softGlow)"/>
  <circle cx="290" cy="270" r="120" fill="#8b5cf6" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Stylized Geometric "A" Ribbon -->
  <!-- Left Wing -->
  <path d="M 156 380 L 256 120 L 296 220 L 226 380 Z" fill="url(#aetherPrimary)" />
  
  <!-- Right Wing -->
  <path d="M 256 120 L 356 380 L 290 380 L 228 226 Z" fill="url(#aetherSecondary)" opacity="0.95"/>

  <!-- Radiant Crossbar Node -->
  <rect x="180" y="280" width="152" height="28" rx="14" fill="url(#glowBar)" />
  <circle cx="256" cy="294" r="10" fill="#ffffff" filter="url(#softGlow)"/>
  <circle cx="256" cy="294" r="5" fill="#38bdf8"/>
</svg>